[project]
name = "learning-langchain"
version = "0.0.1"
description = "Code blocks for the book Learning LangChain."
authors = []
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangChain / LangGraph v1
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    # legacy chains / retrievers / indexes moved to langchain-classic in v1
    "langchain-classic>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langgraph-cli[inmem]>=0.4",
    "langsmith>=0.12",
    # vector stores
    "langchain-postgres>=0.0.17",
    "langchain-chroma>=1.0",
    "psycopg[binary]>=3.2.4",
    # loaders, tools and helpers
    "beautifulsoup4>=4.12.2",
    "pypdf>=5.1.0",
    "ddgs>=9.0",
    "lark>=1.2",
    "tiktoken>=0.8",
    "python-dotenv>=1.0.1",
    "setuptools>=75.8.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.setuptools.package-data]
"*" = ["py.typed"]
